name: VulnCheck
on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  vulncheck:
    name: Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cached: false
      - name: Get official govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
        shell: bash
      - name: Run govulncheck
        shell: bash
        run: |
          set +e
          govulncheck -show verbose ./... 2>&1 | tee /tmp/vulncheck.out
          RESULT=$?
          set -e

          if [ $RESULT -eq 0 ]; then
            echo "No vulnerabilities found."
            exit 0
          fi

          # Check if all remaining vulns are unfixable (stdlib on Go 1.24 or no fix available)
          FIXABLE=$(grep -A2 "Fixed in:" /tmp/vulncheck.out | grep "Fixed in:" | grep -v "N/A" | grep -v "go1.25" | grep -v "go1.26" || true)
          if [ -z "$FIXABLE" ]; then
            echo ""
            echo "::warning::govulncheck found vulnerabilities, but all are either in Go stdlib (requires Go 1.25+) or have no fix available. Passing."
            exit 0
          else
            echo ""
            echo "::error::govulncheck found fixable vulnerabilities:"
            echo "$FIXABLE"
            exit 1
          fi
